<text x="540.0" y="442" text-anchor="middle" font-size="12.5" fill="#5C5C66" font-style="italic" font-family="IBM Plex Sans, -apple-system, sans-serif">Spending inside the circle lands as revenue inside the circle &#8212; whose valuations rise, letting everyone raise more.</text>
<line x1="60" y1="454" x2="1020" y2="454" stroke="#E4E0D6"/>
<text x="60" y="474" font-size="11" font-weight="600" fill="#5C5C66" letter-spacing="1.5" font-family="IBM Plex Sans, -apple-system, sans-serif">THE FINANCING UNDERNEATH &#8212; RAISED, NOT EARNED</text>
