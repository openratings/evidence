<text x="540.0" y="36" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a2e">Reciprocal capital: the investment flows one way, the commitments flow back</text>
<text x="540.0" y="58" text-anchor="middle" font-size="13" fill="#5C5C66">Each link is ordinary commerce; the loop is what matters. <tspan fill="#1E3A5F" font-weight="600">blue = capital in</tspan> · <tspan fill="#B45309" font-weight="600">ochre = spend committed back</tspan></text>
